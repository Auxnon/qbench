[package]
name = "qbench"
version = "0.1.0"
edition = "2024"
description = "A cozy terminal editor for live Postgres tables, built on ratatui + ratatui-cheese"
license = "MIT"
readme = "README.md"
keywords = ["postgres", "tui", "ratatui", "database", "editor"]
categories = ["command-line-utilities", "database"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
fuzzy-matcher = "0.3.7"
ratatui = "0.30"
ratatui-cheese = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
